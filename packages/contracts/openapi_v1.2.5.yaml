openapi: 3.0.3
info:
  title: 志愿服务平台接口契约
  version: 1.2.5
  description: 2026-11-18 PRD v1.3.4配套规格，尚未实现。沿用/api/v1，本次校订后按本文件重新生成客户端。确认学生初始密码为学号后六位，首次登录强制改密。学号和班级均为十位数字，建档不含在校状态。时长以录入单为准，整数部分最多三位、最多一位小数。本轮聚焦平台搭建与功能实现，暂不考虑部署维护。业务字段、枚举及错误码使用snake_case，自动限制固定off。
    沿用：时长模板末列是否有违纪情况，时长与违规核实合并审批。规则未确定时正常审核时长，处罚固定未启用。按表头识别七列与兼容六列，不仅依赖文件名或版本号。
  x-document-revision: 2026-11-21-r3
servers:
- url: /api/v1
  description: 同源相对路径，不指向已部署服务
security:
- session_cookie: []
tags:
- name: 账号
- name: 活动
- name: 报名
- name: 通知
- name: 时长
- name: 名单
- name: 日程
- name: 文件
- name: 导出
- name: 审计
paths:
  /auth/csrf:
    get:
      operationId: get_csrf
      summary: 获取CSRF校验值
      description: 允许匿名调用，绑定同源会话。不得因此获取任何角色。
      tags:
      - 账号
      x-requirement: FR06
      x-acceptance:
      - AC01
      - AC02
      x-roles: []
      parameters: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/csrf_token'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
      security: []
  /auth/login:
    post:
      operationId: login
      summary: 登录账号
      description: 通过Set-Cookie建立HttpOnly Secure SameSite会话。学生以十位学号登录，初始密码使用学号后六位，首次登录强制改密。后续联系学校信息化部门对接统一身份认证。首次改密前仅允许改密、退出及CSRF接口。老师技术账号独立建档并采用独立强凭证。
      tags:
      - 账号
      x-requirement: FR06
      x-acceptance:
      - AC01
      - AC02
      x-roles: []
      parameters:
      - $ref: '#/components/parameters/csrf'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/login_result'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/login_request'
  /auth/change-password:
    post:
      operationId: change_password
      summary: 设置或修改密码
      description: 允许受限首登会话调用。核验当前凭证，修改后撤销旧会话并轮换当前会话。
      tags:
      - 账号
      x-requirement: FR06
      x-acceptance:
      - AC01
      - AC02
      x-roles:
      - student
      - organizer
      - reviewer
      - tech_admin
      parameters:
      - $ref: '#/components/parameters/csrf'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/action_result'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/password_change'
  /auth/logout:
    post:
      operationId: logout
      summary: 退出并撤销会话
      tags:
      - 账号
      x-requirement: FR06
      x-acceptance:
      - AC01
      - AC02
      x-roles:
      - student
      - organizer
      - reviewer
      - tech_admin
      parameters:
      - $ref: '#/components/parameters/csrf'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/action_result'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
  /me:
    get:
      operationId: get_profile
      summary: 查询本人账号与角色
      description: 普通业务接口，首次改密未完成时返回403 password_change_required。
      tags:
      - 账号
      x-requirement: FR06
      x-acceptance:
      - AC02
      x-roles:
      - student
      - organizer
      - reviewer
      - tech_admin
      parameters: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/profile'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
  /activities:
    get:
      operationId: list_activities
      summary: 查询公开活动列表
      description: 需登录，公开指试点范围。public默认published，可显式查看曾公开的completed/cancelled。mine为本人accepted及退出待处理活动，默认不过滤生命周期状态。均只读取获批版本，省略管理字段。group_join_instructions仅本人已录取时返回。关键词、校区、报名阶段、活动状态、进行中状态及日期窗口与timeline
        public/mine一致。from和to须同时提供且from < to，窗口最多31日，按实际时段与[from,to)相交筛选。省略时列表不限定窗口，切换到甘特图时页面保留或初始化为北京时间本周窗口。列表与甘特图携带同一窗口时得到相同活动集合。
        owner_account_id与review_status在此公开接口始终返回403，管理筛选使用管理列表。按activity_code、id稳定排序，在权限与筛选完成后分页。
      tags:
      - 活动
      x-requirement: FR01
      x-acceptance:
      - AC03
      - AC10
      x-roles:
      - student
      - organizer
      - reviewer
      - tech_admin
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: campus
        in: query
        required: false
        schema:
          type: string
      - name: registration_phase
        in: query
        required: false
        schema:
          type: string
          enum:
          - not_open
          - open
          - closed
          - unavailable
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - pending_review
          - published
          - cancelled
          - completed
          - archived
      - name: from
        in: query
        required: false
        schema:
          type: string
          description: from和to须同时提供且from < to，窗口最多31日，按实际时段与[from,to)相交筛选。省略时列表不限定窗口，切换到甘特图时页面保留或初始化为北京时间本周窗口。列表与甘特图携带同一窗口时得到相同活动集合。
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          description: from和to须同时提供且from < to，窗口最多31日，按实际时段与[from,to)相交筛选。省略时列表不限定窗口，切换到甘特图时页面保留或初始化为北京时间本周窗口。列表与甘特图携带同一窗口时得到相同活动集合。
          format: date-time
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - name: is_ongoing
        in: query
        required: false
        schema:
          type: boolean
          description: 省略不筛选，true只返回当前进行中，false只返回当前未进行。按服务端state_evaluated_at与获批安排的实际时段判断，按Asia/Shanghai解释。仅status=published且存在获批时段满足starts_at
            <= now < ends_at时为true。周期活动间隔、草稿、未获批安排、cancelled、completed、archived均为false。即使当前显示working版本也按published版本判断，表示计划正在进行，不表示已经到场。服务端展开完整获批安排判断，不仅检查当前查询窗口或分页中的segments。
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - public
          - mine
          default: public
          description: public为已批准公开活动。mine为本人accepted及退出待处理活动，与timeline mine一致，固定读取获批版本。
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/activity_page'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
  /activities/{id}:
    get:
      operationId: get_activity
      summary: 查询公开活动详情
      description: 只读取已批准公开版本。未公开活动对普通学生返回404。 group_join_instructions仅向本人已录取的活动返回，不能靠客户端隐藏。 点击列表或时间条后重新请求详情，不把列表摘要作为完整详情。提供is_ongoing和state_evaluated_at。
      tags:
      - 活动
      x-requirement: FR01
      x-acceptance:
      - AC03
      x-roles:
      - student
      - organizer
      - reviewer
      - tech_admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/activity'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
  /organizer/activities:
    get:
      operationId: list_managed_activities
      summary: 查询有权管理的活动
      description: 负责人有效角色与当前owner/collaborator成员关系同时满足才可查看，后台按授权查看本学院活动。默认不按活动生命周期或审核状态过滤。from和to须同时提供且from < to，窗口最多31日，按实际时段与[from,to)相交筛选。省略时列表不限定窗口，切换到甘特图时页面保留或初始化为北京时间本周窗口。列表与甘特图携带同一窗口时得到相同活动集合。
        与timeline managed/all使用相同关键词、校区、报名阶段、活动状态、负责人、审核状态、进行中状态与版本范围。revision_scope决定title、schedule、location、capacity及报名字段的展示版本，schedule_revision与revision_state明确该版本。working依次选待审版本、可编辑草稿、获批版本，均不存在时回退最近终态快照且仅供查看。生命周期status始终为活动状态。review_status筛选及has_pending_review/current_review_id独立于展示版本，is_ongoing始终依据获批安排。先权限与筛选，再按activity_code、id稳定排序分页。
        显式managed一律按本人的有效负责人角色和活动成员关系取数，兼任后台也不扩大范围。all只允许授权后台查询。
      tags:
      - 活动
      x-requirement: FR01
      x-acceptance:
      - AC02
      - AC03
      - AC10
      x-roles:
      - organizer
      - reviewer
      - tech_admin
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: campus
        in: query
        required: false
        schema:
          type: string
      - name: registration_phase
        in: query
        required: false
        schema:
          type: string
          enum:
          - not_open
          - open
          - closed
          - unavailable
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - pending_review
          - published
          - cancelled
          - completed
          - archived
      - name: owner_account_id
        in: query
        required: false
        schema:
          type: string
          description: 仅managed/all允许。
          format: uuid
      - name: review_status
        in: query
        required: false
        schema:
          type: string
          description: 仅管理范围允许。按活动当前工作版本状态筛选，独立于展示的revision_scope。draft表示无待审但有可编辑草稿，pending_review表示存在pending审核，approved表示无待审且无可编辑草稿，当前工作版本已获批。前三类均不存在时，按最近终态快照的rejected、withdrawn或cancelled筛选。
          enum:
          - draft
          - pending_review
          - approved
          - rejected
          - withdrawn
          - cancelled
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - name: is_ongoing
        in: query
        required: false
        schema:
          type: boolean
          description: 省略不筛选，true只返回当前进行中，false只返回当前未进行。按服务端state_evaluated_at与获批安排的实际时段判断，按Asia/Shanghai解释。仅status=published且存在获批时段满足starts_at
            <= now < ends_at时为true。周期活动间隔、草稿、未获批安排、cancelled、completed、archived均为false。即使当前显示working版本也按published版本判断，表示计划正在进行，不表示已经到场。服务端展开完整获批安排判断，不仅检查当前查询窗口或分页中的segments。
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: from和to须同时提供且from < to，窗口最多31日，按实际时段与[from,to)相交筛选。省略时列表不限定窗口，切换到甘特图时页面保留或初始化为北京时间本周窗口。列表与甘特图携带同一窗口时得到相同活动集合。
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: from和to须同时提供且from < to，窗口最多31日，按实际时段与[from,to)相交筛选。省略时列表不限定窗口，切换到甘特图时页面保留或初始化为北京时间本周窗口。列表与甘特图携带同一窗口时得到相同活动集合。
      - name: revision_scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - working
          - published
          default: working
          description: working依次取待审、可编辑草稿、获批、最近终态只读快照。published只选获批快照。
      - name: scope
        in: query
        required: false
        description: managed只列有效负责人本人管理的活动，all限后台院内授权。未传时后台取all，其他负责人取managed。页面切换时显式传当前范围。
        schema:
          type: string
          enum:
          - managed
          - all
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/activity_page'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
    post:
      operationId: create_activity
      summary: 创建活动草稿
      description: 创建者自动成为唯一owner。校验完整schedule，按北京时间计算最早开始与最晚结束。报名开放早于截止，截止不晚于首段开始。生成不复用的activity_code，容量为平台总录取名额。
      tags:
      - 活动
      x-requirement: FR01
      x-acceptance:
      - AC03
      - AC10
      x-roles:
      - organizer
      parameters:
      - $ref: '#/components/parameters/csrf'
      - $ref: '#/components/parameters/idempotency'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
