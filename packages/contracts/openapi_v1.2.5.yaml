x-timeline-interaction:
  rendering: Vue与SVG绘制，数据来自后端。支持筛选、列表与甘特图切换、选择与详情联动，不支持拖拽改期、拉伸时长或时间条直接审批。
  selection: 桌面点击名称或时间条打开详情侧栏，手机打开详情页。分段共用activity_id，保留被选时段。切换与返回保留窗口、筛选、选中活动及浏览位置。
  review: 管理详情展示待审提示，进入审核页后读取冻结快照及差异，再通过或驳回。打开详情、进入审核及提交时分别重新检查状态与权限。
  clock: 当前时间指示线使用服务端时刻校准，页面可见时每60秒刷新状态，切回页面或完成业务操作立即刷新。进行中标记以服务端响应为准，响应过期或请求失败时标明状态待刷新。 空窗口也使用分页对象的state_evaluated_at校时，“今天”保留原时间粒度。
  versions: 正在进行按获批安排，待审核按当前审核对象。两种标记可共存，切换published展示不隐藏待审提示。
x-hours-misconduct:
  transaction: 核实由时长整批批准完成，不新建独立待审任务。时长、元信息、异常关联、审计与通知事件原子保存。
  metadata: 按学生、活动、服务日期独立保存最近一次明确上报值、reported的备注事实及核实来源。review_only保存元信息并递增misconduct_version，不替换原时长记录。仅普通备注变化不重复入账。not_provided不更新已存值。
  deduplication: 同一业务键、reported及规范化事实文本构成事实指纹。再次导入已审相同事实复用原结论与incident，不重复创建。已有incident被撤销或事实改变时不复用为当前有效结论，新的reported进入本批核实。独立上报的同事实由老师显式关联，禁止模糊匹配。
  privacy: 批次上报、未核实及不成立的说明只在管理端按已有权限可见。reported行的原备注仅保存在受控批次，不写入或覆盖学生时长接口及导出的hour_record.remark。review_only保留原时长备注。学生经既有本人异常接口查看已确认或撤销记录，源批次ID不授予整批访问权。
  no_hours: 没有正数可认定时长的事实通过既有异常上报接口处理，不使用0或虚构时长。
  future_rules: 保留统一审核中的处理扩展位置。规则确认后再定义类别、适用版本、处置参数和结果，历史是否追溯另行确认。本次所有处罚执行均保持off/not_enabled。
