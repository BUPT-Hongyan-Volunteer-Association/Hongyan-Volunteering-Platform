          minLength: 10
          maxLength: 10
          pattern: ^[0-9]{10}$
        student_name:
          type: string
        activity_code:
          type: string
        service_date:
          type: string
          format: date
        credited_hours:
          type: string
          description: 预览的新有效时长。action=void时固定为0.0，其余有值时为正数、整数部分最多三位且最多一位小数。零值只用于撤销预览，不作为导入或入账值。
          pattern: ^(?:0\.0|0\.[1-9]|[1-9][0-9]{0,2}(?:\.[0-9])?)$
          example: '2.5'
        remark:
          type: string
          maxLength: 2000
        action:
          type: string
          description: review_only表示时长相同而违纪信息需要审核保存，累计差额固定0.0，保留原时长记录ID。
          enum:
          - add
          - skip_identical
          - correct
          - review_only
          - void
          - error
        existing_record_id:
          type: string
          format: uuid
        existing_version:
          type: integer
          minimum: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/field_error'
        raw_values:
          type: object
          additionalProperties:
            type: string
        bound_schedule_revision:
          type: integer
          minimum: 1
        previous_hours:
          type: string
          description: 原当前值，恢复voided记录时为0.0，最多一位小数。
          pattern: ^(?:0(?:\.[0-9])?|[1-9][0-9]{0,2}(?:\.[0-9])?)$
        delta_hours:
          type: string
          description: 新值减旧有效值，最多一位小数，允许负数，仅用于预览，不作为导入值。
          pattern: ^-?\d+(?:\.\d)?$
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/hour_warning'
        misconduct_reported:
          type: string
          description: 模板无=none，有=reported，旧六列缺失=not_provided。not_provided不覆盖已保存信息。仅为负责人上报，不代表核实结论。
          enum:
          - none
          - reported
          - not_provided
        previous_misconduct_reported:
          type: string
          description: 模板无=none，有=reported，旧六列缺失=not_provided。not_provided不覆盖已保存信息。仅为负责人上报，不代表核实结论。
          enum:
          - none
          - reported
          - not_provided
        misconduct_requires_review:
          type: boolean
          description: 新的或改变说明的reported行为true。与已有有效核实结论完全相同可复用为false。
        misconduct_version:
          type: integer
          minimum: 0
          description: 校验时读取的记录元信息版本，未保存过为0。提交冻结，审批事务复核，防止同时覆盖。
        misconduct_review:
          $ref: '#/components/schemas/hour_misconduct_review'
      additionalProperties: false
      required:
      - row_number
      - action
      oneOf:
      - properties:
          action:
            enum:
            - void
          credited_hours:
            enum:
            - '0.0'
          misconduct_reported:
            type: string
            enum:
            - not_provided
          misconduct_requires_review:
            type: boolean
            enum:
            - false
        required:
        - credited_hours
      - properties:
          action:
            enum:
            - add
            - skip_identical
            - correct
            - review_only
            - error
          credited_hours:
            pattern: ^(?:0\.[1-9]|[1-9][0-9]{0,2}(?:\.[0-9])?)$
      description: 当前批次上报字段与核实结果仅有权管理人员可读。批准前的核实输入不返回为已生效结果。reported且需要新核实的行misconduct_requires_review=true，已审同事实可复用旧结论。旧六列not_provided不覆盖既有违纪信息。misconduct_review只在复用既有结论或批准完成后返回。
      allOf:
      - oneOf:
        - properties:
            action:
              type: string
              enum:
              - add
              - skip_identical
              - correct
              - review_only
          required:
          - student_no
          - student_name
          - activity_code
          - service_date
          - credited_hours
          - misconduct_reported
          - misconduct_requires_review
        - properties:
            action:
              type: string
              enum:
              - void
              - error
      - oneOf:
        - properties:
            action:
              type: string
              enum:
              - correct
              - review_only
              - void
          required:
          - existing_record_id
          - existing_version
          - previous_hours
          - delta_hours
          - bound_schedule_revision
        - properties:
            action:
              type: string
              enum:
              - add
              - skip_identical
              - error
      - oneOf:
        - properties:
            action:
              type: string
              enum:
              - review_only
            delta_hours:
              type: string
              enum:
              - '0.0'
        - properties:
            action:
              type: string
              enum:
              - add
              - skip_identical
              - correct
              - void
              - error
