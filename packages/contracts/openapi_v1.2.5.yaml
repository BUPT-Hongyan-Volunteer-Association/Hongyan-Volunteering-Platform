  /admin/student-imports:
    post:
      operationId: upload_student_import
      summary: 上传团委学生名单
      description: 使用学生建档模板 v1.5（.xlsx），工作表为“学生建档”。表头必须包含学号、姓名、年级、班级，学院和旧名单的级部列可选，列顺序不限。每行只要求填写学号和姓名。学号及非空班级须为十位文本数字，保留前导零。
        年级接受 2026 或 2026级，保存为四位年份。年级留空时，学号以 19xx 或 20xx 开头则取前四位，其他学号保持年级为空。非空非法年级按原行报错并显示原值。名单缺少级部或学院列时，新档案相应字段留空，已有档案保留原值。有该列时空值也参与比对。
        遍历第 2 行起的所有非空数据，包括表格范围外的追加行。最多 5,242,880 字节、5,000 条非空数据行，行数在去重前计算。忽略全空行和无值空列，拒绝公式和未知有值列。文件内同学号资料冲突时标出所有相关行，仅对无错的相同资料去重。
        受理后返回批次 ID 和源文件摘要供页面轮询。内容错误标为 invalid，系统校验失败标为 failed。确认后新账号启用，初始密码为学号后六位，首次登录须改密。重复导入保持已有账号资料、密码、角色与停用状态。
      tags:
      - 账号
      x-requirement: FR06
      x-acceptance:
      - AC01
      - AC02
      - AC06
      x-roles:
      - reviewer
      - tech_admin
      parameters:
      - $ref: '#/components/parameters/csrf'
      - $ref: '#/components/parameters/idempotency'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/student_import'
                  request_id:
                    type: string
                    format: uuid
                additionalProperties: false
                required:
                - data
                - request_id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              additionalProperties: false
              required:
              - file
