  /organizer/activities/{id}/hour-imports:
    post:
      operationId: upload_hour_batch
      summary: 上传时长模板并校验
      description: 仅.xlsx、最多5MB和5000条非空数据。仅解析时长录入表，按x-template准确表头识别新版七列或兼容六列。新版第七列必须无或有，有须在备注说明，旧六列缺列记not_provided。含认定依据的旧七列表拒绝。忽略无值空列和全空行，遍历预留200行及Excel
        Table外追加内容，拒绝未知有值列、合计行、公式与宏文件。学号须为十位数字并保留前导零。学生、活动、日期构成业务键。文件内同键比较数值时长、违纪标记和reported时的备注事实，完全相同保留首次，其余skip_identical，不同则相关行全部标错。备注事实仅统一换行并去除首尾空白，不模糊合并。库中同键同时长且无违纪元信息变化才跳过。仅违纪信息变化使用review_only，可用于new或correction模式，不增加累计，绑定原记录安排与版本。时长变化或voided恢复仍须correction。new新增绑定所选历史获批安排，correction绑定原记录origin_schedule_revision，当前改期不阻断历史更正。服务日期不得未来且须与绑定安排的北京时间自然日有正交集，跨午夜拆行，结束恰为00:00不占次日。时长以录入单为准，须为正数、整数部分最多三位且最多一位小数，超出一位小数报错，不自动四舍五入。不设24小时单条上限。超过当天计划或跨活动日累计24小时生成警告并要求说明，允许人工批准。更正、未报名补录及reported备注必填，批次说明和附件选填。校验失败invalid，解析异常failed，均不入账也不产生已核实异常。
        5MB按5,242,880字节计，行数在去重前按非空数据行计。 时长单元格读取原始数值，拒绝文本时长及超出一位小数的原值。学号按文本读取。Excel日期按工作簿1900或1904日期系统解析整日序号，1900系统序号60无效。文本日期严格按公历YYYY-MM-DD解析。非未来以平台北京时间当天为准。
      tags:
      - 时长
      x-requirement: FR04
      x-acceptance:
      - AC06
      - AC07
      - AC09
      - AC11
      x-roles:
      - organizer
      - reviewer
      - tech_admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/csrf'
      - $ref: '#/components/parameters/idempotency'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
