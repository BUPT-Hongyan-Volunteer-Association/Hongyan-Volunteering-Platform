        '409':
          description: 状态、版本、名额或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: 成功
