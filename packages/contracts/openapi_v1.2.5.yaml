        to。按activity_code、activity_id稳定排序。public默认published，可显式查看曾公开的completed/cancelled。mine为本人accepted及退出待处理活动，默认不过滤生命周期状态。public/mine仅获批版本，不返回管理字段。managed为有效角色且当前成员，all为授权后台，默认不按生命周期或审核状态过滤。managed/all默认working，依次选待审版本、可编辑草稿、获批版本，均不存在时回退最近终态快照且仅供查看。published只选获批版本，没有获批版本则不返回该活动。所有内容字段与segments取所选版本，revision_state和schedule_revision明确所选版本。review_status按当前工作版本筛选，has_pending_review及current_review_id独立于展示版本。is_ongoing始终按完整获批安排计算，取消活动不计计划重叠。列表与日程共用权限、筛选、窗口及排序语义，禁止前端仅筛当前页。color_index为活动ID标准小写UUID字符串的UTF-8字节FNV-1a
        32位无符号散列模6。segments保留真实起止，前端按窗口裁剪。无人员名单或异常。 managed在兼任后台时仍限本人有效管理的活动，与管理列表的显式scope相同。每页返回统一的state_evaluated_at，空页也返回此值。
      tags:
      - 日程
      x-requirement: FR07
      x-acceptance:
      - AC02
      - AC03
      - AC10
      x-roles:
      - student
      - organizer
      - reviewer
      - tech_admin
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          enum:
          - public
          - mine
          - managed
          - all
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: 起止均必填，按[from,to)与实际时段相交，窗口长度大于0且最多31日。
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: 起止均必填，按[from,to)与实际时段相交，窗口长度大于0且最多31日。
      - name: revision_scope
        in: query
        required: false
        schema:
          type: string
          description: public/mine固定published。managed/all默认working，按待审、可编辑草稿、获批、最近终态只读快照的顺序选取。
          enum:
          - published
          - working
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: campus
        in: query
        required: false
        schema:
          type: string
      - name: registration_phase
        in: query
        required: false
        schema:
          type: string
          enum:
          - not_open
          - open
          - closed
          - unavailable
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - pending_review
          - published
          - cancelled
          - completed
          - archived
      - name: owner_account_id
        in: query
        required: false
        schema:
          type: string
          description: 仅managed/all允许。
          format: uuid
      - name: review_status
        in: query
        required: false
        schema:
          type: string
          description: 仅管理范围允许。按活动当前工作版本状态筛选，独立于展示的revision_scope。draft表示无待审但有可编辑草稿，pending_review表示存在pending审核，approved表示无待审且无可编辑草稿，当前工作版本已获批。前三类均不存在时，按最近终态快照的rejected、withdrawn或cancelled筛选。
          enum:
          - draft
          - pending_review
          - approved
          - rejected
          - withdrawn
          - cancelled
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - name: is_ongoing
        in: query
        required: false
        schema:
          type: boolean
          description: 省略不筛选，true只返回当前进行中，false只返回当前未进行。按服务端state_evaluated_at与获批安排的实际时段判断，按Asia/Shanghai解释。仅status=published且存在获批时段满足starts_at
            <= now < ends_at时为true。周期活动间隔、草稿、未获批安排、cancelled、completed、archived均为false。即使当前显示working版本也按published版本判断，表示计划正在进行，不表示已经到场。服务端展开完整获批安排判断，不仅检查当前查询窗口或分页中的segments。
