      description: 审核人不得为提交者。批准事务按固定顺序锁定源记录、目标业务键及涉及学生日期，复核源版本、目标无冲突、历史安排与警告快照。任一冲突全部回滚且保持pending_review。通过后所有源记录标voided，所有目标生成current，更新累计及关联申诉可结案依据，同时写审计和通知。旧新记录关联group_id。驳回保留源值。警告校验沿用hour_review_decision。申诉按本人涉及的源或目标记录及实际修复结果结案。
        投影当日累计先扣除全组源有效值，再加全组目标值，跨学生、活动或日期分别核算。 目标记录写correction_group_id，源记录另写voided_by_group_id并保留原创建来源。 批准前在事务中重算警告。警告新增、消失、数值已变或当前有警告却缺少匹配摘要时，返回409
