  /admin/hour-imports/{id}/decision:
    post:
      operationId: review_hour_batch
      summary: 批准或驳回时长批次
      description: 仅pending_review且审核人不是提交者。同一审核页展示时长、违纪标记、备注、已有核实结果。批准时misconduct_reviews恰好覆盖misconduct_requires_review=true的所有行，每项确认属实或不成立且填写意见，缺项、重复、额外项、空意见返回422
        validation_error。驳回整批不改变时长或异常记录。事务内按固定顺序锁定学生日期、时长业务键和违纪元信息，检查授权、获批安排、时长版本、misconduct_version及可选关联异常版本。new新增，correction替代，void撤销，review_only仅保存违纪元信息，原时长ID和累计不变。任何冲突整批回滚并返回409
        version_conflict，不能时长成功而核实失败。重算投影时长及警告，确认属实且未关联已有同事实异常时创建confirmed记录，source_type=hour_import，service_date取服务日期，facts取备注，submitted_by取批次提交人，reviewed_by取当前审核人，review_reason取逐行意见，时间精度为日期，禁止伪造occurred_at。关联已有异常须同学生活动日期、confirmed且版本匹配，保留原事实与审计，在批次保存关联。确认不成立仅保存行核实结果，不创建confirmed异常。新信息和核实结果、时长与通知事件一次提交。重复审批或完全相同的已审事实复用已有结论及异常，不重复创建和通知。规则未启用时discipline_status固定not_enabled，禁止根据标记自动扣时长或限制报名。旧六列not_provided不覆盖元信息，后续none、时长撤销或更正均不自动撤销已核实异常，须另由老师通过现有撤销操作明确处理并留痕。
        批准前在事务中重算警告。警告新增、消失、数值已变或当前有警告却缺少匹配摘要时，返回409 warning_review_required，context含最新warnings与warning_snapshot_hash。审核人复看后用新幂等键与新摘要重试。警告仍存在但仅缺非空白接受依据时返回422
        validation_error。
      tags:
      - 时长
      x-requirement: FR04
      x-acceptance:
      - AC06
      - AC07
      - AC09
      - AC11
      x-roles:
      - reviewer
      - tech_admin
