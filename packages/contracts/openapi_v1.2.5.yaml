          type: boolean
          readOnly: true
          description: 按服务端state_evaluated_at与获批安排的实际时段判断，按Asia/Shanghai解释。仅status=published且存在获批时段满足starts_at <= now < ends_at时为true。周期活动间隔、草稿、未获批安排、cancelled、completed、archived均为false。即使当前显示working版本也按published版本判断，表示计划正在进行，不表示已经到场。服务端展开完整获批安排判断，不仅检查当前查询窗口或分页中的segments。
        state_evaluated_at:
          type: string
          format: date-time
          readOnly: true
