<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>选择测试身份 · 鸿雁志愿服务平台</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        color: #17243a;
        --brand: #003399;
        --line: #e4e9f0;
        --muted: #526174;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        border-top: 4px solid var(--brand);
        background: white;
        font-size: 15px;
        line-height: 1.55;
      }
      header {
        border-bottom: 1px solid var(--line);
      }
      .mast {
        max-width: 1216px;
        min-height: 68px;
        margin: auto;
        padding: 12px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.06em;
        white-space: nowrap;
      }
      .brand b {
        margin-right: 2px;
        color: var(--brand);
      }
      .environment {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        max-width: 1120px;
        margin: clamp(42px, 8vh, 88px) auto;
        padding: 0 32px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.4;
        letter-spacing: -0.035em;
      }
      .intro {
        color: var(--muted);
        margin: 8px 0 30px;
      }
      form {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 28px;
      }
      section {
        border-top: 2px solid #ccd8eb;
      }
      .area-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 18px;
      }
      svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: var(--brand);
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h2 {
        margin: 0;
        font-size: 18px;
      }
      .area-desc {
        margin: 5px 0 14px;
        font-size: 13px;
        color: var(--muted);
      }
      button {
        width: 100%;
        font: inherit;
        color: #17243a;
        border: 0;
        border-top: 1px solid var(--line);
        background: white;
        padding: 12px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
        cursor: pointer;
      }
      button:last-child {
        border-bottom: 1px solid var(--line);
      }
      button:hover,
      button:focus-visible {
        background: #f5f8fc;
        color: var(--brand);
      }
      button:active {
        background: #eaf1fc;
      }
      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      button strong {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }
      button small {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .arrow {
        width: 8px;
        height: 8px;
        border: solid var(--brand);
        border-width: 1.5px 1.5px 0 0;
        transform: rotate(45deg);
        margin-right: 6px;
      }
      #entry-status {
        color: var(--brand);
        font-size: 14px;
      }
      form[aria-busy='true'] button {
        cursor: progress;
      }
      button[aria-busy='true'] {
        background: #eaf1fc;
        color: var(--brand);
      }
      [role='alert'] {
        background: #fff4f0;
        padding: 12px 16px;
        border-radius: 6px;
        color: #9c3327;
      }
      @media (max-width: 760px) {
        .mast {
          min-height: 56px;
          padding-inline: 18px;
        }
        .brand {
          font-size: 18px;
        }
        main {
          margin: 26px auto;
          padding: 0 18px 24px;
        }
        h1 {
          font-size: 24px;
        }
        .intro {
          margin-bottom: 20px;
        }
        form {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .area-head {
          padding-top: 12px;
        }
        .area-desc {
          margin-bottom: 8px;
        }
        button {
          padding: 9px 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="mast">
        <strong class="brand"><b>鸿雁</b>志愿服务平台</strong
        ><span class="environment">本地体验</span>
      </div>
    </header>
    <main>
      <h1>选择测试身份</h1>
      <p class="intro">选择账号后将在独立的浏览器窗口打开，可同时体验不同身份。</p>
      <!-- feedback -->
      <p id="entry-status" role="status" hidden></p>
      <form id="roles" method="post"><!-- accounts --></form>
    </main>
    <script>
      const form = document.getElementById('roles');
      const feedback = document.getElementById('entry-status');
      form.addEventListener('submit', (event) => {
        if (form.getAttribute('aria-busy') === 'true') {
          event.preventDefault();
          return;
        }
        form.setAttribute('aria-busy', 'true');
        event.submitter?.setAttribute('aria-busy', 'true');
        feedback.hidden = false;
        feedback.textContent = '正在打开体验窗口…';
      });
      window.addEventListener('pageshow', () => {
        form.removeAttribute('aria-busy');
        form.querySelector('[aria-busy]')?.removeAttribute('aria-busy');
        feedback.hidden = true;
      });
    </script>
  </body>
</html>
