name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  basic:
    name: 基础检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_only@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:generate
      - run: pnpm --filter @hongyan/api exec prisma validate
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm --filter @hongyan/api build
      - run: pnpm --filter @hongyan/api exec node --test test/hour-workbook.test.mjs test/hour-preview.test.mjs test/activity-flow.test.mjs test/notice-flow.test.mjs test/attendance-flow.test.mjs test/hour-ledger.test.mjs
      - run: pnpm --filter @hongyan/api exec node --test test/exports-and-audit.test.mjs