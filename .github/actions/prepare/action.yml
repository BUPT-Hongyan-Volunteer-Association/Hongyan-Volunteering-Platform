name: Prepare workspace
description: Install the locked toolchain and generate both clients from repository sources.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, version from package.json
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install and generate
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm contracts:generate
        pnpm db:generate
